<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>04c – @submit.prevent and methods</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
<main class="max-w-xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">@submit.prevent and methods</h1>

    <!--
        The state is getting long, so it moves into a function in a <script> below.
        x-data="purchaseForm()" calls that function and uses the object it returns.
    -->
    <form x-data="purchaseForm()" @submit.prevent="preview()"
          class="bg-white border border-gray-200 rounded-lg shadow-sm p-6 space-y-4">

        <div>
            <label for="customer" class="block font-medium mb-1">Customer</label>
            <select id="customer" x-model="customerId" required
                    class="w-full border border-gray-300 rounded px-3 py-2">
                <option value="">Choose a customer</option>
                <option value="1">Margaret Stroustrup</option>
                <option value="2">Tim Ritchie</option>
                <option value="3">Frances Berners</option>
            </select>
        </div>

        <p>Product: <strong>Wireless Keyboard 0</strong> at $202.11</p>

        <div>
            <label for="quantity" class="block font-medium mb-1">Quantity</label>
            <input id="quantity" type="number" min="1" max="10" required x-model.number="quantity"
                   class="w-32 border border-gray-300 rounded px-3 py-2">
        </div>

        <div class="flex gap-2">
            <!-- type="submit" triggers the form's @submit. -->
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded">
                Preview purchase
            </button>
            <!-- type="button" does NOT submit; it only runs its own @click. -->
            <button type="button" @click="reset()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded">
                Reset
            </button>
        </div>

        <p x-show="message" x-text="message"
           class="bg-green-50 border border-green-200 text-green-800 rounded p-3"></p>
    </form>
</main>

<script>
    // A plain function that returns the component's state AND its methods.
    function purchaseForm() {
        return {
            customerId: '',
            quantity: 1,
            priceCents: 20211,
            message: '',

            get totalCents() {return this.quantity * this.priceCents;},

            // A method: called from the page as preview()
            preview() {
                const total = (this.totalCents / 100).toFixed(2);
                this.message = `Customer ${this.customerId}: ${this.quantity} × Wireless Keyboard 0 = $${total}`;
            },

            reset() {
                this.customerId = '';
                this.quantity = 1;
                this.message = '';
            },
        };
    }
</script>
</body>
</html>
